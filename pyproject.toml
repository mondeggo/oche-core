[project]
name = "ochecore"
version = "0.1.1"
description = "AutoDarts event gateway for audio callers and home automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.9,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings[yaml]>=2.8,<3",
    "pygame-ce>=2.5.3,<3",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
    "zeroconf>=0.148,<1",
]

[project.scripts]
ochecore = "ochecore.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ressources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/ochecore"]

[tool.hatch.build.targets.sdist]
exclude = ["/.idea"]
